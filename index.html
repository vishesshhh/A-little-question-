<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4c9e9">
<title>A little question ❤️</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app" id="app">
<div class="ambient"></div><div class="sparkles" id="sparkles"></div><div class="hearts-bg" id="hearts"></div>
<div id="stage"></div>
</main>
<script>
const SECRET='WANNA HAVE SOME GULU GULU';
const rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
const stageEl=document.getElementById('stage');
const positions=[[17,38],[83,38],[17,65],[83,65],[50,86],[38,87],[63,87]];
function background(){
 for(let i=0;i<28;i++){const e=document.createElement('i');const s=3+(i%5);Object.assign(e.style,{left:`${(i*43+7)%98}%`,top:`${(i*29+3)%100}%`,width:s+'px',height:s+'px',animationDelay:`${(i*.37)%3.5}s`});document.getElementById('sparkles').appendChild(e)}
 for(let i=0;i<30;i++){const e=document.createElement('span');Object.assign(e.style,{left:`${(i*31+5)%103-2}%`,animationDelay:`${(i*.63)%10}s`,animationDuration:`${10+(i%8)}s`,fontSize:`${20+(i*11)%48}px`,'--drift':`${-35+(i*17)%70}px`});e.textContent='❤️';document.getElementById('hearts').appendChild(e)}
}
function burst(n=12){const d=document.createElement('div');d.className='burst';for(let i=0;i<n;i++){const s=document.createElement('span');s.style.setProperty('--a',`${i*360/n}deg`);s.textContent='❤️';d.appendChild(s)}document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function screen(cls,html){stageEl.innerHTML=`<section class="screen ${cls}">${html}</section>`;return stageEl.querySelector('section')}
function intro(){let caught=0;const s=screen('intro',`<div class="intro-top"><h1>Hey dear <span>❤️</span></h1><p>I have a little question for you...</p><p class="tiny">Catch the hearts first 👀</p><div class="score">Hearts: 0/5 ❤️</div></div>`);positions.forEach(([x,y],i)=>{const b=document.createElement('button');b.className='catch'+(i>=5?' decoy':'');b.style.cssText=`left:${x}%;top:${y}%;animation-delay:${i*.18}s`;b.textContent='❤️';b.onclick=()=>{if(i>=5)return;b.style.pointerEvents='none';b.style.opacity='0';caught++;s.querySelector('.score').textContent=`Hearts: ${caught}/5 ❤️`;burst();if(caught===5){const p=document.createElement('div');p.className='success-pop';p.textContent='You caught them all! 💕';s.appendChild(p);setTimeout(hidden,700)}};s.appendChild(b)});}
function hidden(){const s=screen('hidden',`<div class="hidden-card"><h2>Now there's something hidden...</h2><p class="redline">Can you figure it out? 👀</p><p class="hint">Use the keyboard to unlock it ❤️</p><button class="go">Let's go ❤️</button></div>`);s.querySelector('.go').onclick=()=>{burst(20);setTimeout(secret,520)}}
function secret(){let typed='';const s=screen('secret',`<div class="secret-card"><h2>Type the secret message...</h2><p class="hint faded">Tap the glowing letter ❤️</p><div class="secret-display"></div><div class="keyboard"></div><div class="unlock" style="display:none">Unlocked! ❤️</div></div>`);const display=s.querySelector('.secret-display'), keyboard=s.querySelector('.keyboard');
 function render(){display.innerHTML='';let cursor=0;SECRET.split(' ').forEach((word,wi)=>{if(wi) {const sp=document.createElement('span');sp.className='word-space';display.appendChild(sp)}const w=document.createElement('span');w.className='word';for(let j=0;j<word.length;j++){const q=document.createElement('span');q.className=cursor<typed.length?'filled':'';q.textContent=cursor<typed.length?SECRET[cursor]:'_';w.appendChild(q);cursor++}display.appendChild(w)});keyboard.innerHTML='';rows.forEach(row=>{const kr=document.createElement('div');kr.className='keyrow';row.split('').forEach(letter=>{const b=document.createElement('button');b.className='key'+(SECRET[typed.length]===letter?' glow':'');b.textContent=letter;b.onclick=()=>press(letter);kr.appendChild(b)});keyboard.appendChild(kr)});}
 function press(letter){const expected=SECRET[typed.length];if(expected===' '){if(letter===' ')typed+=' ';else {display.classList.add('shake');setTimeout(()=>display.classList.remove('shake'),300);return}}else if(letter===expected){typed+=letter}else{display.classList.add('shake');setTimeout(()=>display.classList.remove('shake'),300);return}render();if(typed===SECRET){s.querySelector('.unlock').style.display='block';setTimeout(question,900)}}
 function key(e){if(/^[a-zA-Z]$/.test(e.key))press(e.key.toUpperCase());else if(e.key===' ')press(' ')}
 window.addEventListener('keydown',key);s._cleanup=()=>window.removeEventListener('keydown',key);render();}
function question(){const s=screen('question',`<div class="question-card"><h2>Wanna have some gulu gulu? ❤️</h2><p class="with">With me? 😳</p><button class="yes">YES 🙈❤️</button><button class="maybe">Maybe 👀</button></div>`);let count=0;const maybe=s.querySelector('.maybe');maybe.onclick=()=>{count++;const maxX=Math.min(125,innerWidth*.25),maxY=Math.min(180,innerHeight*.18);maybe.style.setProperty('--mx',`${(Math.random()*2-1)*maxX}px`);maybe.style.setProperty('--my',`${(Math.random()*2-1)*maxY}px`);if(count===1){const t=document.createElement('div');t.className='try';t.innerHTML='<div>Hehe, nice try 😜</div><strong>Just press YES ❤️</strong>';s.querySelector('.question-card').insertBefore(t,maybe)}if(count>1&&!s.querySelector('.tease')){const t=document.createElement('div');t.className='tease';t.textContent='Nope! 😝';s.querySelector('.question-card').appendChild(t)}s.querySelector('.yes').classList.add('yes-attention')};s.querySelector('.yes').onclick=()=>{burst(26);setTimeout(final,850)}}
function final(){screen('final',`<div class="final-card"><div class="big-heart">❤️</div><h2>Wanna have some gulu gulu? ❤️</h2><p class="with">With me? 😳</p><h3>HEHE... I KNEW IT! ❤️</h3><p class="looks">Looks like it's a YES. 🙈</p><p class="sign">— dev</p><div class="final-hearts">💕 💗 💕</div></div>`)}
background();intro();
</script>
</body>
</html>
